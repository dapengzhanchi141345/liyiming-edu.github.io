<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI地理虚拟考察 - 李彦明</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; padding: 30px 0; }
        header h1 { font-size: 2.3em; color: white; }
        header p { color: rgba(255,255,255,0.8); margin-top: 10px; }
        .regions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 30px; }
        .region { background: white; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: transform 0.3s; }
        .region:hover { transform: translateY(-5px); }
        .region .icon { font-size: 2.5em; margin-bottom: 10px; }
        .region h4 { color: #11998e; margin-bottom: 5px; }
        .region p { color: #666; font-size: 12px; }
        .footer { text-align: center; margin-top: 40px; color: rgba(255,255,255,0.7); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 AI地理虚拟考察</h1>
            <p>3D地貌模拟 · 气候动态演示 · 虚拟实地考察</p>
            <p style="margin-top: 10px; font-size: 14px;">开发者：李彦明 · 15684394135</p>
        </header>

        <div class="regions">
            <div class="region"><div class="icon">🏔️</div><h4>地形地貌</h4><p>山地/平原/高原</p></div>
            <div class="region"><div class="icon">🌧️</div><h4>气候类型</h4><p>气候带/降水分布</p></div>
            <div class="region"><div class="icon">🗺️</div><h4>世界地理</h4><p>大洲大洋/国家区域</p></div>
            <div class="region"><div class="icon">🇨🇳</div><h4>中国地理</h4><p>省区/河流/资源</p></div>
            <div class="region"><div class="icon">🌊</div><h4>海洋地理</h4><p>洋流/渔业/港口</p></div>
            <div class="region"><div class="icon">🏭</div><h4>工业布局</h4><p>工业区位/产业带</p></div>
            <div class="region"><div class="icon">🌾</div><h4>农业区位</h4><p>农业地域类型</p></div>
            <div class="region"><div class="icon">🚗</div><h4>交通城市</h4><p>交通线/城市群</p></div>
        </div>

        <div class="footer">
            <p>© 2026 李彦明 · AI地理虚拟考察</p>
            <p style="font-size: 12px; margin-top: 5px;">弥补实验不足 · 年费99元</p>
        </div>
    </div>
</body>
</html>
