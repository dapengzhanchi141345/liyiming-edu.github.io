<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI课程后台管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f0f1a; color: #e2e8f0; }
        .card { background: rgba(30, 27, 75, 0.6); border: 1px solid rgba(99, 102, 241, 0.2); }
        .gradient-text { background: linear-gradient(135deg, #6366f1, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8 gradient-text">AI课程后台管理系统</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Question Bank Management -->
            <div class="card rounded-2xl p-6">
                <h3 class="text-xl font-bold mb-4">📝 题库管理</h3>
                <div class="space-y-3">
                    <div class="flex justify-between items-center p-3 bg-[rgba(99,102,241,0.1)] rounded-lg">
                        <span>物理题库</span>
                        <span class="text-indigo-400">120题</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-[rgba(99,102,241,0.1)] rounded-lg">
                        <span>化学题库</span>
                        <span class="text-purple-400">95题</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-[rgba(99,102,241,0.1)] rounded-lg">
                        <span>数学题库</span>
                        <span class="text-blue-400">150题</span>
                    </div>
                </div>
                <button class="w-full mt-4 px-4 py-2 bg-indigo-500 rounded-lg hover:bg-indigo-600 transition">管理题库</button>
            </div>

            <!-- Student Progress -->
            <div class="card rounded-2xl p-6">
                <h3 class="text-xl font-bold mb-4">📊 学生学习进度</h3>
                <div class="space-y-3">
                    <div class="flex justify-between">
                        <span>总学习人数</span>
                        <span class="text-green-400 font-bold">128人</span>
                    </div>
                    <div class="flex justify-between">
                        <span>今日活跃</span>
                        <span class="text-cyan-400 font-bold">45人</span>
                    </div>
                    <div class="flex justify-between">
                        <span>平均正确率</span>
                        <span class="text-amber-400 font-bold">78%</span>
                    </div>
                </div>
                <button class="w-full mt-4 px-4 py-2 bg-cyan-500 rounded-lg hover:bg-cyan-600 transition">查看详情</button>
            </div>

            <!-- AI Model Settings -->
            <div class="card rounded-2xl p-6">
                <h3 class="text-xl font-bold mb-4">🤖 AI模型配置</h3>
                <div class="space-y-3">
                    <div class="p-3 bg-green-500/10 border border-green-500/30 rounded-lg">
                        <div class="flex items-center gap-2">
                            <span class="text-green-400">●</span>
                            <span>豆包API - 已连接</span>
                        </div>
                        <p class="text-xs text-gray-400 mt-1">响应时间: 1.2s</p>
                    </div>
                    <div class="p-3 bg-yellow-500/10 border border-yellow-500/30 rounded-lg">
                        <div class="flex items-center gap-2">
                            <span class="text-yellow-400">●</span>
                            <span>文心一言API - 待配置</span>
                        </div>
                        <p class="text-xs text-gray-400 mt-1">响应时间: -</p>
                    </div>
                </div>
                <button class="w-full mt-4 px-4 py-2 bg-purple-500 rounded-lg hover:bg-purple-600 transition">配置API</button>
            </div>

            <!-- Wrong Question Analysis -->
            <div class="card rounded-2xl p-6">
                <h3 class="text-xl font-bold mb-4">❌ 错题分析</h3>
                <div class="space-y-2">
                    <div class="p-2 bg-red-500/10 rounded">
                        <div class="text-sm">力学题目错误率: 45%</div>
                        <div class="w-full bg-gray-700 rounded-full h-2 mt-1">
                            <div class="bg-red-500 h-2 rounded-full" style="width: 45%"></div>
                        </div>
                    </div>
                    <div class="p-2 bg-orange-500/10 rounded">
                        <div class="text-sm">化学方程式错误率: 38%</div>
                        <div class="w-full bg-gray-700 rounded-full h-2 mt-1">
                            <div class="bg-orange-500 h-2 rounded-full" style="width: 38%"></div>
                        </div>
                    </div>
                </div>
                <button class="w-full mt-4 px-4 py-2 bg-amber-500 rounded-lg hover:bg-amber-600 transition">导出报告</button>
            </div>

            <!-- Badge Management -->
            <div class="card rounded-2xl p-6">
                <h3 class="text-xl font-bold mb-4">🏅 徽章系统</h3>
                <div class="grid grid-cols-4 gap-2">
                    <div class="text-center text-2xl" title="初次尝试">🌟</div>
                    <div class="text-center text-2xl" title="三日连续">🔥</div>
                    <div class="text-center text-2xl" title="一周坚持">🔥</div>
                    <div class="text-center text-2xl" title="十全十美">💯</div>
                    <div class="text-center text-2xl" title="提示大师">💡</div>
                    <div class="text-center text-2xl" title="物理入门">🔬</div>
                    <div class="text-center text-2xl" title="数学达人">📐</div>
                    <div class="text-center text-2xl" title="竞赛预备">🏆</div>
                </div>
                <button class="w-full mt-4 px-4 py-2 bg-pink-500 rounded-lg hover:bg-pink-600 transition">管理徽章</button>
            </div>

            <!-- Settings -->
            <div class="card rounded-2xl p-6">
                <h3 class="text-xl font-bold mb-4">⚙️ 系统设置</h3>
                <div class="space-y-3">
                    <label class="flex items-center justify-between">
                        <span>开启语音识别</span>
                        <input type="checkbox" checked class="w-5 h-5">
                    </label>
                    <label class="flex items-center justify-between">
                        <span>苏格拉底式教学</span>
                        <input type="checkbox" checked class="w-5 h-5">
                    </label>
                    <label class="flex items-center justify-between">
                        <span>错题自动推送</span>
                        <input type="checkbox" checked class="w-5 h-5">
                    </label>
                </div>
                <button class="w-full mt-4 px-4 py-2 bg-gray-600 rounded-lg hover:bg-gray-700 transition">保存设置</button>
            </div>
        </div>
    </div>
</body>
</html>
