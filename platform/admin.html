<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理 - 李彦明AI课程</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC',system-ui,sans-serif;background:#0f0f1a;color:#e2e8f0}
.header{background:rgba(15,23,42,0.95);padding:15px 20px;border-bottom:1px solid rgba(99,102,241,0.2)}
.header-inner{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.logo{color:#6366f1;font-weight:700}
.back{color:#94a3b8;text-decoration:none;font-size:0.9em}
.back:hover{color:#6366f1}
.container{max-width:1000px;margin:0 auto;padding:30px 20px}
h1{font-size:1.5em;margin-bottom:25px;text-align:center;background:linear-gradient(135deg,#6366f1,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:10px;margin-bottom:25px;justify-content:center}
.tab{padding:8px 20px;background:rgba(30,27,75,0.6);border:1px solid rgba(99,102,241,0.2);border-radius:20px;cursor:pointer;font-size:0.85em}
.tab.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent}
.card{background:rgba(30,27,75,0.6);border:1px solid rgba(99,102,241,0.2);border-radius:12px;padding:20px;margin-bottom:20px}
.card h3{font-size:1em;margin-bottom:15px;color:#fff}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:0.85em;color:#94a3b8;margin-bottom:5px}
.form-group select,.form-group input{width:100%;padding:10px;background:rgba(15,23,42,0.8);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#e2e8f0;font-size:0.9em}
.btn{padding:10px 20px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:8px;color:#fff;font-size:0.9em;cursor:pointer}
.btn:hover{opacity:0.9}
.btn-secondary{background:rgba(99,102,241,0.2)}
.table{width:100%;font-size:0.8em}
.table th,.table td{padding:10px;text-align:left;border-bottom:1px solid rgba(99,102,241,0.1)}
.table th{color:#94a3b8}
.footer{text-align:center;padding:20px;color:#64748b;font-size:0.8em}
</style>
</head>
<body>
<div class="header">
<div class="header-inner">
<div class="logo">⚙️ 后台管理</div>
<a href="/" class="back">← 返回首页</a>
</div>
</div>

<div class="container">
<h1>题库管理</h1>

<div class="tabs">
<div class="tab active">📝 题库管理</div>
<div class="tab">📊 学情分析</div>
<div class="tab">👥 学生管理</div>
<div class="tab">⚙️ 系统设置</div>
</div>

<div class="card">
<h3>➕ 添加新题目</h3>
<div class="form-group">
<label>选择学科</label>
<select><option>物理</option><option>化学</option><option>数学</option><option>语文</option></select>
</div>
<div class="form-group">
<label>难度等级</label>
<select><option>基础</option><option>中等</option><option>困难</option><option>竞赛</option></select>
</div>
<div class="form-group">
<label>题目内容</label>
<input type="text" placeholder="请输入题目">
</div>
<div class="form-group">
<label>正确答案</label>
<input type="text" placeholder="请输入答案">
</div>
<div class="form-group">
<label>提示1</label>
<input type="text" placeholder="第一层提示">
</div>
<div class="form-group">
<label>提示2</label>
<input type="text" placeholder="第二层提示">
</div>
<button class="btn">保存题目</button>
</div>

<div class="card">
<h3>📋 题目列表</h3>
<table class="table">
<tr><th>ID</th><th>学科</th><th>难度</th><th>题目</th><th>操作</th></tr>
<tr><td>001</td><td>物理</td><td>基础</td><td>牛顿第一定律...</td><td><a href="#" style="color:#6366f1">编辑</a></td></tr>
<tr><td>002</td><td>化学</td><td>中等</td><td>方程式配平...</td><td><a href="#" style="color:#6366f1">编辑</a></td></tr>
<tr><td>003</td><td>数学</td><td>基础</td><td>勾股定理...</td><td><a href="#" style="color:#6366f1">编辑</a></td></tr>
</table>
</div>

<div class="card">
<h3>📥 批量导入</h3>
<p style="font-size:0.85em;color:#94a3b8;margin-bottom:15px">支持Excel/Word格式批量导入题目</p>
<button class="btn btn-secondary">选择文件</button>
</div>
</div>

<div class="footer">📞 联系：15684394135</div>
</body>
</html>
