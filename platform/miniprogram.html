<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李彦明AI课程 - 微信小程序版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#0f0f1a;color:#e2e8f0}
.header{background:rgba(15,23,42,0.95);padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(99,102,241,0.2)}
.logo{font-size:1.1em;font-weight:700;color:#6366f1}
.streak{display:flex;align-items:center;gap:5px;font-size:0.85em}
.container{padding:15px}
.card{background:rgba(30,27,75,0.6);border:1px solid rgba(99,102,241,0.2);border-radius:12px;padding:15px;margin-bottom:15px}
.card h3{font-size:0.95em;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:rgba(15,23,42,0.6);border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:all 0.2s}
.item:hover{border:1px solid rgba(99,102,241,0.3)}
.item .icon{font-size:1.8em;margin-bottom:5px}
.item .name{font-size:0.8em}
.item .count{font-size:0.7em;color:#94a3b8}
.bottom-nav{position:fixed;bottom:0;left:0:right:0;background:rgba(15,23,42,0.95);border-top:1px solid rgba(99,102,241,0.2);padding:10px;display:flex;justify-content:space-around}
.nav-item{display:flex;flex-direction:column;align-items:center;font-size:0.7em;color:#94a3b8}
.nav-item.active{color:#6366f1}
.nav-item .icon{font-size:1.3em;margin-bottom:3px}
</style>
</head>
<body>
<div class="header">
<div class="logo">🎓 李彦明AI课程</div>
<div class="streak"><span>🔥</span><span>7天</span></div>
</div>

<div class="container">
<div class="card">
<h3>👋 你好，同学！今天想学什么？</h3>
</div>

<div class="card">
<h3>📚 选择学科</h3>
<div class="grid">
<div class="item"><div class="icon">🔬</div><div class="name">物理</div><div class="count">120题</div></div>
<div class="item"><div class="icon">⚗️</div><div class="name">化学</div><div class="count">95题</div></div>
<div class="item"><div class="icon">📐</div><div class="name">数学</div><div class="count">150题</div></div>
<div class="item"><div class="icon">📚</div><div class="name">语文</div><div class="count">80题</div></div>
<div class="item"><div class="icon">🌍</div><div class="name">英语</div><div class="count">60题</div></div>
<div class="item"><div class="icon">📜</div><div class="name">历史</div><div class="count">70题</div></div>
</div>
</div>

<div class="card">
<h3>🎯 今日挑战</h3>
<p style="font-size:0.85em;color:#94a3b8">完成今日目标：再做2题即可解锁徽章</p>
<div style="margin-top:10px;height:6px;background:rgba(99,102,241,0.2);border-radius:3px">
<div style="width:60%;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:3px"></div>
</div>
</div>

<div class="card">
<h3>❌ 待复习错题 <span style="color:#ef4444">5题</span></h3>
<div style="font-size:0.8em;color:#94a3b8;padding:8px;background:rgba(239,68,68,0.1);border-radius:8px;margin-bottom:5px">
物理 - 牛顿第二定律
</div>
<div style="font-size:0.8em;color:#94a3b8;padding:8px;background:rgba(245,158,11,0.1);border-radius:8px">
化学 - 方程式配平
</div>
</div>
</div>

<div class="bottom-nav">
<div class="nav-item active"><div class="icon">🏠</div><div>首页</div></div>
<div class="nav-item"><div class="icon">📚</div><div>课程</div></div>
<div class="nav-item"><div class="icon">📊</div><div>进度</div></div>
<div class="nav-item"><div class="icon">👤</div><div>我的</div></div>
</div>
</body>
</html>
