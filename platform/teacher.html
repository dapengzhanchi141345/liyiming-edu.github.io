<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师工作台 - 李彦明AI课程</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC',system-ui,sans-serif;background:#0f0f1a;color:#e2e8f0}
.header{background:rgba(15,23,42,0.95);padding:15px 20px;border-bottom:1px solid rgba(99,102,241,0.2)}
.header-inner{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.logo{color:#6366f1;font-weight:700}
.back{color:#94a3b8;text-decoration:none;font-size:0.9em}
.back:hover{color:#6366f1}
.container{max-width:800px;margin:0 auto;padding:30px 20px}
h1{font-size:1.5em;margin-bottom:20px;text-align:center;background:linear-gradient(135deg,#6366f1,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}
.stat{background:rgba(30,27,75,0.6);border:1px solid rgba(99,102,241,0.2);border-radius:10px;padding:15px;text-align:center}
.stat .num{font-size:1.8em;font-weight:700;color:#6366f1}
.stat .label{font-size:0.75em;color:#94a3b8;margin-top:3px}
.card{background:rgba(30,27,75,0.6);border:1px solid rgba(99,102,241,0.2);border-radius:12px;padding:20px;margin-bottom:15px}
.card h3{font-size:1em;margin-bottom:15px;color:#fff}
.btn{display:block;width:100%;padding:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:8px;color:#fff;font-size:0.9em;cursor:pointer;margin-bottom:10px}
.btn:hover{opacity:0.9}
.btn-secondary{background:rgba(99,102,241,0.2)}
.table{width:100%;font-size:0.8em}
.table th,.table td{padding:10px;text-align:left;border-bottom:1px solid rgba(99,102,241,0.1)}
.table th{color:#94a3b8;font-weight:500}
.badge{padding:3px 8px;border-radius:10px;font-size:0.75em}
.badge-green{background:rgba(16,185,129,0.2);color:#10b981}
.badge-yellow{background:rgba(245,158,11,0.2);color:#f59e0b}
.badge-red{background:rgba(239,68,68,0.2);color:#ef4444}
.footer{text-align:center;padding:20px;color:#64748b;font-size:0.8em}
</style>
</head>
<body>
<div class="header">
<div class="header-inner">
<div class="logo">👨‍🏫 教师工作台</div>
<a href="/" class="back">← 返回首页</a>
</div>
</div>

<div class="container">
<h1>班级学情分析</h1>
<div class="stats">
<div class="stat"><div class="num">128</div><div class="label">班级人数</div></div>
<div class="stat"><div class="num">92%</div><div class="label">完成率</div></div>
<div class="stat"><div class="num">78%</div><div class="label">正确率</div></div>
<div class="stat"><div class="num">3</div><div class="label">待关注</div></div>
</div>

<div class="card">
<h3>✨ AI智能出题</h3>
<button class="btn">📝 生成基础题（10道）</button>
<button class="btn btn-secondary">📝 生成中等题（10道）</button>
<button class="btn btn-secondary">📝 生成竞赛题（5道）</button>
</div>

<div class="card">
<h3>📊 学生排名</h3>
<table class="table">
<tr><th>排名</th><th>学生</th><th>正确率</th><th>状态</th></tr>
<tr><td>🥇 1</td><td>张同学</td><td style="color:#10b981">95%</td><td><span class="badge badge-green">优秀</span></td></tr>
<tr><td>🥈 2</td><td>李同学</td><td style="color:#10b981">92%</td><td><span class="badge badge-green">优秀</span></td></tr>
<tr><td>🥉 3</td><td>王同学</td><td style="color:#06b6d4">88%</td><td><span class="badge badge-green">良好</span></td></tr>
<tr><td>4</td><td>刘同学</td><td style="color:#f59e0b">72%</td><td><span class="badge badge-yellow">关注</span></td></tr>
<tr><td>5</td><td>陈同学</td><td style="color:#ef4444">65%</td><td><span class="badge badge-red">需辅导</span></td></tr>
</table>
</div>

<div class="card">
<h3>💡 AI教学建议</h3>
<div style="font-size:0.85em;color:#94a3b8;line-height:1.8">
<p>1. 班级在"牛顿第二定律"错误率较高，建议课堂重点讲解</p>
<p>2. 张同学、李同学表现优秀，可推荐参加竞赛培训</p>
<p>3. 刘同学、陈同学需要额外辅导</p>
</div>
</div>

<div class="card">
<h3>📤 导出功能</h3>
<button class="btn btn-secondary">📄 导出成绩单</button>
<button class="btn btn-secondary">📈 导出分析报告</button>
<button class="btn btn-secondary">📋 导出知识点掌握表</button>
</div>
</div>

<div class="footer">📞 联系：15684394135</div>
</body>
</html>
