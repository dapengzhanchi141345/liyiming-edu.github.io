<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家长监控 - 李彦明AI课程</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC',system-ui,sans-serif;background:#0f0f1a;color:#e2e8f0}
.header{background:rgba(15,23,42,0.95);padding:15px 20px;border-bottom:1px solid rgba(99,102,241,0.2)}
.header-inner{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.logo{color:#6366f1;font-weight:700}
.back{color:#94a3b8;text-decoration:none;font-size:0.9em}
.back:hover{color:#6366f1}
.container{max-width:800px;margin:0 auto;padding:30px 20px}
h1{font-size:1.5em;margin-bottom:20px;text-align:center;background:linear-gradient(135deg,#6366f1,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:30px}
.stat{background:rgba(30,27,75,0.6);border:1px solid rgba(99,102,241,0.2);border-radius:12px;padding:20px;text-align:center}
.stat .num{font-size:2em;font-weight:700;color:#6366f1}
.stat .label{font-size:0.85em;color:#94a3b8;margin-top:5px}
.card{background:rgba(30,27,75,0.6);border:1px solid rgba(99,102,241,0.2);border-radius:12px;padding:20px;margin-bottom:15px}
.card h3{font-size:1em;margin-bottom:15px;color:#fff}
.bar{height:8px;background:rgba(99,102,241,0.2);border-radius:4px;margin-bottom:10px}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#6366f1,#06b6d4)}
.tip{padding:12px;background:rgba(99,102,241,0.1);border-radius:8px;margin-bottom:10px;font-size:0.85em;color:#94a3b8}
.footer{text-align:center;padding:20px;color:#64748b;font-size:0.8em}
</style>
</head>
<body>
<div class="header">
<div class="header-inner">
<div class="logo">👨‍👩‍👧 家长监控</div>
<a href="/" class="back">← 返回首页</a>
</div>
</div>

<div class="container">
<h1>今日学习报告</h1>
<div class="stats">
<div class="stat"><div class="num">12</div><div class="label">学习题目</div></div>
<div class="stat"><div class="num">9</div><div class="label">正确数量</div></div>
<div class="stat"><div class="num">75%</div><div class="label">正确率</div></div>
<div class="stat"><div class="num">90</div><div class="label">获得积分</div></div>
</div>

<div class="card">
<h3>📊 各学科表现</h3>
<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:0.85em;margin-bottom:5px"><span>物理</span><span style="color:#f472b6">82%</span></div><div class="bar"><div class="bar-fill" style="width:82%;background:#f472b6"></div></div></div>
<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:0.85em;margin-bottom:5px"><span>数学</span><span style="color:#60a5fa">90%</span></div><div class="bar"><div class="bar-fill" style="width:90%;background:#60a5fa"></div></div></div>
<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:0.85em;margin-bottom:5px"><span>语文</span><span style="color:#f87171">75%</span></div><div class="bar"><div class="bar-fill" style="width:75%;background:#f87171"></div></div></div>
</div>

<div class="card">
<h3>⚠️ 薄弱知识点</h3>
<div class="tip">🔴 物理 - 牛顿第二定律（错误率45%）</div>
<div class="tip">🟠 化学 - 方程式配平（错误率38%）</div>
<div class="tip">🟡 语文 - 文言文翻译（错误率32%）</div>
</div>

<div class="card">
<h3>💡 学习建议</h3>
<div class="tip">1. 加强力学练习，每天额外5道</div>
<div class="tip">2. 保持数学优势，挑战竞赛题</div>
<div class="tip">3. 已连续学习3天，继续加油！</div>
</div>
</div>

<div class="footer">📞 联系：15684394135</div>
</body>
</html>
